<!DOCTYPE html>
<html>
<head>
  <title>Buscar Factura Disponible</title>
</head>
<body>
  <h1>Buscar Factura Disponible</h1>
  <form id="formulario">
    <input type="text" id="usuario" placeholder="Usuario" required />
    <input type="password" id="clave" placeholder="Clave" required />
    <input type="text" id="rnc" placeholder="RNC Emisor" required />
    <input type="text" id="factura" placeholder="Factura Inicial" required />
    <button type="submit">Buscar</button>
  </form>

  <div id="resultado"></div>

  <script>
    document.getElementById('formulario').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value;
      const clave = document.getElementById('clave').value;
      const rnc = document.getElementById('rnc').value;
      const factura = document.getElementById('factura').value;

      const respuestaEl = document.getElementById('resultado');
      respuestaEl.innerText = 'Buscando...';

      try {
        const res = await fetch('https://dominicana.tempusorione.workers.dev', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            usuario,
            clave,
            RNCEmisor: rnc,
            facturaInicial: factura
          })
        });

        const data = await res.json();

        if (res.ok) {
          respuestaEl.innerHTML = `
            <p><strong>Factura disponible:</strong> ${data.factura}</p>
          `;
        } else {
          respuestaEl.innerHTML = `
            <p><strong>Error:</strong> ${data.mensaje || 'Ocurrió un error'}</p>
          `;
        }
      } catch (err) {
        respuestaEl.innerHTML = `<p><strong>Error:</strong> ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
