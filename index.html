<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buscar Factura Disponible</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f5f5f5;
    }
    form {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 0.8rem;
      margin-top: 1rem;
      width: 100%;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #0070f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0059c1;
    }
    #resultado {
      margin-top: 2rem;
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      max-width: 500px;
      margin: 2rem auto;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

<form id="facturaForm">
  <h2>Buscar factura disponible</h2>
  <label>Última factura conocida:</label>
  <input type="text" id="facturaInicial" required value="E310008000001">

  <label>Cantidad a verificar:</label>
  <input type="number" id="cantidad" required value="50" min="1">

  <button type="submit">Buscar</button>
</form>

<div id="resultado"></div>

<script>
  document.getElementById('facturaForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const facturaInicial = document.getElementById('facturaInicial').value;
    const cantidad = parseInt(document.getElementById('cantidad').value);

    const response = await fetch("https://dominicana.tempusorione.workers.dev", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ facturaInicial, cantidad })
    });

    const resultado = document.getElementById("resultado");

    if (!response.ok) {
      const error = await response.json();
      resultado.innerText = `Error: ${error.error}`;
      return;
    }

    const data = await response.json();
    resultado.innerText = `Resultado:\nFactura: ${data.factura || "N/A"}\nMensaje: ${data.mensaje}`;
  });
</script>

</body>
</html>
